<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>自动发布接口 - 小米开放平台</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  header { padding: 12px 24px; border-bottom: 1px solid #eee; }
  .auto-publish-api_item__CeYdz { margin: 16px 24px; }
  .auto-publish-api_buttonGroup__7cXKg { display: flex; gap: 8px; align-items: center; }
  .auto-publish-api_download_button__lEwiq { width: 388px; padding: 8px; background: #f5f6f8; }
  .mdu-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .3); }
  .mdu-modal.on { display: block; }
  .mdu-modal-content { background: #fff; margin: 160px auto; width: 360px; padding: 16px; }
</style>
</head>
<body>
<!-- 照 2026-10 实登页面的结构做的桩（类名是 CSS Modules 带哈希的）。header 里那串
     48 位十六进制是诱饵：旧版助手扫整页取第一个 40~64 位长串，会把它当成私钥。 -->
<div id="root"><div class="wrapper"><div class="base_base-layout__sGNkx">
  <header class="base_header__VN-oN" id="xiaomihyperos-console-header">
    <span class="user-name">开发者</span>
    <span>会话：9f1c2b3a4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f70</span>
  </header>
  <div class="main_content__9Zv3B"><div class="auto-publish-api_container__8V4-u">
    <div class="auto-publish-api_header__3xQIX">自动发布接口</div>
    <div class="auto-publish-api_guide__x2PE5">使用指南 · Demo 下载 · Java8示例 · Python3示例</div>
    <div class="auto-publish-api_version__dNPAt">
      <div class="auto-publish-api_header__3xQIX">版本状态</div>
      <div class="auto-publish-api_body__+RFxu">
        <div class="auto-publish-api_item__CeYdz">
          <span class="auto-publish-api_subTitle__M8hJt">获取公钥</span>
          <div class="auto-publish-api_download_button__lEwiq"><span>下载公钥文件</span></div>
        </div>
        <div class="auto-publish-api_item__CeYdz">
          <span class="auto-publish-api_subTitle__M8hJt">获取私钥</span>
          <div class="auto-publish-api_buttonGroup__7cXKg">
            <div class="auto-publish-api_download_button__lEwiq"><span id="key" style="color: rgb(181, 188, 199); font-size: 14px;"></span></div>
            <button type="button" class="mdu-btn mdu-btn-default" id="copy"><span>复制私钥</span></button>
            <button type="button" class="mdu-btn mdu-btn-primary" id="reset"><span>重置私钥</span></button>
          </div>
          <span class="auto-publish-api_tips__rzw9G">私钥生效规则：1.未获取私钥：接口描述的密码为开发者账号登录密码 2.已获取私钥：接口描述的密码为私钥字符串 3.重置私钥：接口将会以最新的私钥为准</span>
        </div>
      </div>
    </div>
  </div></div>
</div></div></div>
<div class="mdu-modal" id="modal">
  <div class="mdu-modal-content" role="dialog">
    <p>重置后原私钥立即失效，确定重置吗？</p>
    <button type="button" class="mdu-btn" id="cancel"><span>取 消</span></button>
    <button type="button" class="mdu-btn mdu-btn-primary" id="ok"><span>确 定</span></button>
  </div>
</div>
<script>
  document.cookie = "mideveloper_ph=ph-test; path=/";
  document.cookie = "userId=10086; path=/";
  // 和真页面一样：打开时显示已有的私钥（真页面从哪个接口来不重要，桩里用 /__fixture/key）；
  // 只有点「生成私钥」/「重置私钥」并确认时才调 getPrivateKey——它每调一次就生成一把
  // 新私钥，返回 {code: 0, data: "<新私钥>", msg: "success"}。私钥状态由 e2e 的路由桩掌握；
  // x-fixture 头让桩分辨这是页面自己发的请求（扩展绝不该自己调 getPrivateKey）。
  const keyEl = document.getElementById("key");
  const resetBtn = document.getElementById("reset");
  const modal = document.getElementById("modal");
  window.__noDomUpdate = false; // 置 true 时生成后页面不更新显示，只能从接口返回里拿到新私钥
  const api = (path) => fetch(path + "?mideveloper_ph=ph-test&userId=10086", { headers: { "x-fixture": "page" } }).then((r) => r.json());
  const show = (key) => {
    keyEl.textContent = key || "";
    resetBtn.firstElementChild.textContent = key ? "重置私钥" : "生成私钥";
  };
  const generate = () => api("/pltapi/uiue/devtool/getPrivateKey").then((d) => {
    if (d.code === 0 && !window.__noDomUpdate) setTimeout(() => show(d.data), 400);
  });
  // 私钥是页面异步拉回来的：先渲染骨架，600ms 后才显示。
  setTimeout(() => api("/__fixture/key").then((d) => show(d.data)), 600);
  // 没有私钥时「生成私钥」直接生成；有私钥时「重置私钥」先弹确认框。
  resetBtn.onclick = () => (keyEl.textContent ? modal.classList.add("on") : generate());
  document.getElementById("cancel").onclick = () => modal.classList.remove("on");
  document.getElementById("ok").onclick = () => { modal.classList.remove("on"); generate(); };
</script>
</body>
</html>
